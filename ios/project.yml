# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Generate the project with:  brew install xcodegen && xcodegen generate
name: Svitlo
options:
  bundleIdPrefix: com.mykolaturchyn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: uk

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Simulator: http://localhost:8787
      # iPhone on the same Wi-Fi: http://<LocalHostName>.local:8787  (scutil --get LocalHostName)
      SVITLO_API_BASE_URL: "http://MacBook-Pro-2.local:8787"
    Release:
      # Replace with the deployed backend URL.
      SVITLO_API_BASE_URL: "https://svitlo-api.example.com"

targets:
  Svitlo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mykolaturchyn.svitlo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Світло
        CFBundleDevelopmentRegion: uk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SvitloAPIBaseURL: $(SVITLO_API_BASE_URL)
        NSLocalNetworkUsageDescription: "Щоб отримувати графік із сервера розробки на вашому Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mykolaturchyn.svitlo
            CFBundleURLSchemes: [svitlo]
    entitlements:
      path: App/Svitlo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mykolaturchyn.svitlo
    dependencies:
      - target: SvitloWidget

  SvitloWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mykolaturchyn.svitlo.widget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Світло
        SvitloAPIBaseURL: $(SVITLO_API_BASE_URL)
        NSLocalNetworkUsageDescription: "Щоб отримувати графік із сервера розробки на вашому Mac."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SvitloWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mykolaturchyn.svitlo

  SvitloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Svitlo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Svitlo:
    build:
      targets:
        Svitlo: all
        SvitloWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SvitloTests
